<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Learn2Live | Create Account</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    >


    <!-- Register CSS -->

    <link
        rel="stylesheet"
        href="register.css"
    >


    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <link rel="stylesheet" href="theme.css">
    <script src="auth.js"></script>
</head>


<body>


    <div class="register-page">

        <div class="register-card">


            <!-- =========================
                 LOGO
            ========================== -->

            <div class="brand">

                <img
                    src="logo.png"
                    class="brand-logo"
                    alt="Learn2Live Logo"
                >

                <h1>
                    Learn2Live
                </h1>

                <p>
                    Create your account and start learning.
                </p>

            </div>



            <!-- =========================
                 REGISTER FORM
            ========================== -->

            <form
                id="registerForm"
                novalidate
            >


                <!-- NAME -->

                <div class="input-group">

                    <label for="fullName">
                        Name
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your name"
                            autocomplete="name"
                            maxlength="50"
                            required
                        >

                    </div>

                    <small
                        id="nameError"
                        class="error-message">
                    </small>

                </div>



                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email ID
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <small
                        id="emailError"
                        class="error-message">
                    </small>

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-shield-halved"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggleConfirmPassword"
                            aria-label="Show password"
                        >

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                    <!-- Password Match -->

                    <small
                        id="passwordMatch"
                        class="password-match">
                    </small>

                </div>



                <!-- =========================
                     PASSWORD STRENGTH
                ========================== -->

                <div class="strength">

                    <div class="strength-header">

                        <span>
                            Password Strength
                        </span>

                        <small id="strengthText">
                            Enter a password
                        </small>

                    </div>


                    <div class="strength-bar">

                        <div
                            class="strength-fill"
                            id="strengthFill">
                        </div>

                    </div>

                </div>



                <!-- =========================
                     PASSWORD REQUIREMENTS
                ========================== -->

                <div class="password-rules">

                    <p id="ruleLength">

                        <i class="fa-solid fa-circle"></i>

                        At least 8 characters

                    </p>


                    <p id="ruleUpper">

                        <i class="fa-solid fa-circle"></i>

                        One uppercase letter

                    </p>


                    <p id="ruleNumber">

                        <i class="fa-solid fa-circle"></i>

                        One number

                    </p>


                    <p id="ruleSpecial">

                        <i class="fa-solid fa-circle"></i>

                        One special character

                    </p>

                </div>



                <!-- =========================
                     TERMS
                ========================== -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>

                            I agree to the
                            <a href="#">
                                Terms & Conditions
                            </a>
                            and
                            <a href="#">
                                Privacy Policy
                            </a>

                        </span>

                    </label>

                </div>



                <!-- =========================
                     REGISTER BUTTON
                ========================== -->

                <button
                    type="submit"
                    class="register-btn"
                    id="registerButton"
                >

                    Create Account

                    <i class="fa-solid fa-arrow-right"></i>

                </button>



                <!-- =========================
                     LOGIN
                ========================== -->

                <div class="login-link">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>


            </form>

        </div>

    </div>



    <!-- =========================
         TOAST
    ========================== -->

    <div
        class="toast"
        id="toast"
    >

        <i class="fa-solid fa-circle-check"></i>

        <span id="toastMessage">
            Account created successfully!
        </span>

    </div>



    <!-- =========================
         LOADING
    ========================== -->

    <div
        class="loading-overlay"
        id="loadingOverlay"
    >

        <div class="loader"></div>

        <p>
            Creating your Learn2Live account...
        </p>

    </div>



    <!-- JavaScript -->

    <script src="register.js"></script>

</body>

</html>
