<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Learn2Live</title>


    <!-- =====================================================
         FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            overflow: hidden;

            font-family: 'Poppins', sans-serif;

            background: #f5f7fa;

            color: #0b1736;
        }


        /* =====================================================
           SPLASH SCREEN
        ====================================================== */

        .splash-screen {

            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(36, 84, 255, 0.10),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 15% 20%,
                    rgba(36, 84, 255, 0.07),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(91, 128, 255, 0.08),
                    transparent 28%
                ),

                #f5f7fa;
        }


        /* =====================================================
           BACKGROUND GLOW
        ====================================================== */

        .glow {

            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(36, 84, 255, 0.12),
                    rgba(36, 84, 255, 0.035) 45%,
                    transparent 70%
                );

            filter: blur(5px);

            animation:
                glowMove 6s ease-in-out infinite;
        }


        /* =====================================================
           DECORATIVE CIRCLES
        ====================================================== */

        .circle {

            position: absolute;

            border-radius: 50%;

            border: 1px solid rgba(36, 84, 255, 0.08);

            animation:
                floatCircle 7s ease-in-out infinite;
        }


        .circle-one {

            width: 300px;
            height: 300px;

            top: -130px;
            left: -100px;
        }


        .circle-two {

            width: 430px;
            height: 430px;

            right: -210px;
            bottom: -210px;

            animation-delay: 1.5s;
        }


        .circle-three {

            width: 180px;
            height: 180px;

            right: 13%;
            top: 10%;

            border-color: rgba(36, 84, 255, 0.055);

            animation-delay: 3s;
        }


        /* =====================================================
           SMALL FLOATING DOTS
        ====================================================== */

        .dot {

            position: absolute;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #2454ff;

            opacity: 0.18;

            animation:
                dotFloat 4s ease-in-out infinite;
        }


        .dot-one {
            top: 25%;
            left: 18%;
        }


        .dot-two {
            top: 68%;
            left: 11%;

            width: 5px;
            height: 5px;

            animation-delay: 1s;
        }


        .dot-three {
            top: 23%;
            right: 18%;

            width: 5px;
            height: 5px;

            animation-delay: 2s;
        }


        .dot-four {
            bottom: 22%;
            right: 13%;

            animation-delay: 0.5s;
        }


        /* =====================================================
           CONTENT
        ====================================================== */

        .splash-content {

            position: relative;

            z-index: 10;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            animation:
                contentFade 1s ease;
        }


        /* =====================================================
           LOGO
        ====================================================== */

        .logo-wrapper {

            position: relative;

            width: 210px;
            height: 210px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .logo-glow {

            position: absolute;

            width: 190px;
            height: 190px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(36, 84, 255, 0.14),
                    transparent 68%
                );

            animation:
                logoGlow 2.8s ease-in-out infinite;
        }


        .splash-logo {

            position: relative;

            z-index: 2;

            width: 190px;
            height: 190px;

            object-fit: contain;

            animation:
                logoZoom 1.4s cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                ) forwards;
        }


        /* =====================================================
           BRAND NAME
        ====================================================== */

        .brand-name {

            margin-top: 12px;

            color: #0b1736;

            font-size: 34px;

            line-height: 1.2;

            font-weight: 600;

            letter-spacing: 0.3px;

            opacity: 0;

            animation:
                brandShow 0.8s ease 0.65s forwards;
        }


        /* =====================================================
           TAGLINE
        ====================================================== */

        .tagline {

            margin-top: 7px;

            color: #6f7a8e;

            font-size: 12px;

            font-weight: 400;

            letter-spacing: 0.5px;

            opacity: 0;

            animation:
                taglineShow 0.8s ease 0.9s forwards;
        }


        /* =====================================================
           LOADING LINE
        ====================================================== */

        .loading-line {

            position: relative;

            width: 65px;
            height: 3px;

            margin-top: 20px;

            overflow: hidden;

            border-radius: 20px;

            background: #dfe5f0;

            opacity: 0;

            animation:
                loadingShow 0.5s ease 1s forwards;
        }


        .loading-line::before {

            content: "";

            position: absolute;

            left: -45px;
            top: 0;

            width: 45px;
            height: 100%;

            border-radius: 20px;

            background: #2454ff;

            animation:
                loadingMove 1.3s ease-in-out infinite;
        }


        /* =====================================================
           ANIMATIONS
        ====================================================== */

        @keyframes contentFade {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        @keyframes logoZoom {

            0% {

                opacity: 0;

                transform:
                    scale(0.55);

            }

            55% {

                opacity: 1;

                transform:
                    scale(1.08);

            }

            100% {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        @keyframes logoGlow {

            0%,
            100% {

                transform: scale(0.92);

                opacity: 0.55;
            }

            50% {

                transform: scale(1.12);

                opacity: 1;
            }

        }


        @keyframes brandShow {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes taglineShow {

            from {

                opacity: 0;

                transform:
                    translateY(8px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes loadingShow {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        @keyframes loadingMove {

            0% {
                left: -45px;
            }

            50% {
                left: 65px;
            }

            100% {
                left: -45px;
            }

        }


        @keyframes glowMove {

            0%,
            100% {

                transform:
                    translate(0, 0)
                    scale(0.9);

            }

            50% {

                transform:
                    translate(25px, -15px)
                    scale(1.08);

            }

        }


        @keyframes floatCircle {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(0deg);

            }

            50% {

                transform:
                    translateY(-18px)
                    rotate(8deg);

            }

        }


        @keyframes dotFloat {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-12px);

            }

        }


        /* =====================================================
           TABLET
        ====================================================== */

        @media (max-width: 768px) {

            .logo-wrapper {

                width: 175px;
                height: 175px;
            }


            .splash-logo {

                width: 160px;
                height: 160px;
            }


            .logo-glow {

                width: 165px;
                height: 165px;
            }


            .brand-name {

                font-size: 29px;
            }


            .tagline {

                font-size: 11px;
            }

        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 480px) {

            .logo-wrapper {

                width: 165px;
                height: 165px;
            }


            .splash-logo {

                width: 150px;
                height: 150px;
            }


            .logo-glow {

                width: 155px;
                height: 155px;
            }


            .brand-name {

                margin-top: 10px;

                font-size: 27px;
            }


            .tagline {

                font-size: 10px;

                padding: 0 20px;
            }


            .loading-line {

                margin-top: 17px;
            }


            .circle-three {

                right: -70px;
                top: 15%;
            }

        }

    </style>


    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <link rel="stylesheet" href="theme.css">
    <script src="auth.js"></script>
</head>


<body>


    <!-- =================================================
         SPLASH SCREEN
    ================================================== -->

    <div class="splash-screen">


        <!-- Background -->

        <div class="glow"></div>

        <div class="circle circle-one"></div>

        <div class="circle circle-two"></div>

        <div class="circle circle-three"></div>


        <div class="dot dot-one"></div>

        <div class="dot dot-two"></div>

        <div class="dot dot-three"></div>

        <div class="dot dot-four"></div>



        <!-- Main Content -->

        <div class="splash-content">


            <div class="logo-wrapper">

                <div class="logo-glow"></div>

                <img
                    src="logo.png"
                    alt="Learn2Live Logo"
                    class="splash-logo">

            </div>


            <h1 class="brand-name">
                Learn2Live
            </h1>


            <p class="tagline">
                Practical Skills for a Confident Life
            </p>


            <div class="loading-line"></div>


        </div>


    </div>



    <!-- =================================================
         REDIRECT
    ================================================== -->

    <script>

        setTimeout(function () {

            window.location.href = "home.html";

        }, 3000);

    </script>


</body>

</html>
