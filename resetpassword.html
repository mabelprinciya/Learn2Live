<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Learn2Live</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

<style>
:root {
    --bg:#f5f7fa;
    --navy:#0b1736;
    --navy-light:#17264a;
    --blue:#2454ff;
    --muted:#6d778b;
    --border:#e1e6ef;
    --blue-soft:#edf3ff;
    --white:#fff;
}
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body {
    min-height:100vh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    color:var(--navy);
}
.card {
    width:100%;
    max-width:440px;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:22px;
    padding:38px 34px;
    box-shadow:0 18px 55px rgba(11,23,54,.08);
}
.logo {
    width:58px;
    height:58px;
    display:grid;
    place-items:center;
    margin:0 auto 22px;
    background:var(--blue-soft);
    color:var(--blue);
    border-radius:18px;
    font-size:27px;
}
h1 {
    font-size:25px;
    text-align:center;
    font-weight:700;
    letter-spacing:-.6px;
}
.subtitle {
    margin:10px auto 28px;
    max-width:310px;
    color:var(--muted);
    text-align:center;
    font-size:13px;
    line-height:1.8;
}
.field {
    margin-bottom:18px;
}
label {
    display:block;
    font-size:12px;
    font-weight:600;
    margin-bottom:8px;
}
.input-wrap {
    position:relative;
}
input {
    width:100%;
    padding:13px 45px 13px 14px;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
    font-size:13px;
    color:var(--navy);
    background:#fff;
    transition:.2s;
}
input:focus {
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(36,84,255,.09);
}
.toggle-password {
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:18px;
}
.requirements {
    background:#f8faff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    margin:4px 0 20px;
}
.requirements p {
    font-size:11px;
    color:var(--muted);
    margin-bottom:8px;
}
.requirement {
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:var(--muted);
    margin-top:6px;
}
.requirement i {
    font-size:14px;
}
.requirement.valid {
    color:#16834a;
}
.btn {
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    background:var(--blue);
    color:#fff;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}
.btn:hover:not(:disabled) {
    background:#1945e8;
    transform:translateY(-1px);
}
.btn:disabled {
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}
.message {
    display:none;
    padding:12px 13px;
    margin-top:17px;
    border-radius:10px;
    font-size:12px;
    line-height:1.7;
    overflow-wrap:anywhere;
}
.message.error {
    display:block;
    background:#fff0f0;
    color:#b42318;
    border:1px solid #ffd6d6;
}
.message.success {
    display:block;
    background:#ecfdf3;
    color:#167647;
    border:1px solid #b7ebca;
}
.back-link {
    display:block;
    margin-top:23px;
    text-align:center;
    color:var(--muted);
    text-decoration:none;
    font-size:12px;
}
.back-link i {
    margin-right:5px;
}
.back-link:hover {
    color:var(--blue);
}
@media(max-width:480px) {
    .card {
        padding:30px 22px;
        border-radius:18px;
    }
    h1 {
        font-size:23px;
    }
}
</style>
</head>

<body>
<main class="card">
    <div class="logo">
        <i class="ri-lock-password-line"></i>
    </div>

    <h1>Create new password</h1>
    <p class="subtitle">
        Choose a strong password for your Learn2Live account.
    </p>

    <form id="resetForm">
        <div class="field">
            <label for="newPassword">New password</label>
            <div class="input-wrap">
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                    required
                >
                <button
                    type="button"
                    class="toggle-password"
                    data-target="newPassword"
                    aria-label="Show password"
                >
                    <i class="ri-eye-line"></i>
                </button>
            </div>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <div class="input-wrap">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter new password"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                    required
                >
                <button
                    type="button"
                    class="toggle-password"
                    data-target="confirmPassword"
                    aria-label="Show password"
                >
                    <i class="ri-eye-line"></i>
                </button>
            </div>
        </div>

        <div class="requirements">
            <p>Password requirements</p>

            <div class="requirement" id="lengthRule">
                <i class="ri-checkbox-circle-line"></i>
                At least 8 characters
            </div>

            <div class="requirement" id="matchRule">
                <i class="ri-checkbox-circle-line"></i>
                Both passwords must match
            </div>
        </div>

        <button type="submit" class="btn" id="resetBtn">
            Reset Password
        </button>

        <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <a href="login.html" class="back-link">
        <i class="ri-arrow-left-line"></i> Back to Login
    </a>
</main>

<script>
/*
 * Use the same deployed Google Apps Script Web App URL
 * as forgotpassword.html.
 */
const GAS_URL = "https://script.google.com/macros/s/AKfycbyJaMe9F-x_54uTZanA1t9YFwffsqzELTax5JXzhYVYjFXNC-TKbfHf6el3ITwKvMkbCg/exec";

const form = document.getElementById("resetForm");
const newPassword = document.getElementById("newPassword");
const confirmPassword = document.getElementById("confirmPassword");
const resetBtn = document.getElementById("resetBtn");
const message = document.getElementById("message");

let passwordUpdated = false;

/* Show / hide password */
document.querySelectorAll(".toggle-password").forEach(function(button) {
    button.addEventListener("click",function() {
        const field = document.getElementById(button.dataset.target);
        const icon = button.querySelector("i");
        const show = field.type === "password";

        field.type = show ? "text" : "password";
        icon.className = show ? "ri-eye-off-line" : "ri-eye-line";
        button.setAttribute(
            "aria-label",
            show ? "Hide password" : "Show password"
        );
    });
});

/* Password validation indicators */
function updateRules() {
    const lengthValid = newPassword.value.length >= 8;
    const matchValid =
        confirmPassword.value.length > 0 &&
        newPassword.value === confirmPassword.value;

    document.getElementById("lengthRule")
        .classList.toggle("valid",lengthValid);

    document.getElementById("matchRule")
        .classList.toggle("valid",matchValid);
}

newPassword.addEventListener("input",updateRules);
confirmPassword.addEventListener("input",updateRules);

function showMessage(text,type) {
    message.textContent = text;
    message.className = "message " + type;
}

/* Read the one-time token from the reset URL */
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if (!token) {
    showMessage(
        "Reset link is missing or invalid. Please return to Forgot Password and try again.",
        "error"
    );
    resetBtn.disabled = true;
}

/* Submit the new password to Code.gs */
form.addEventListener("submit",async function(event) {
    event.preventDefault();

    if (passwordUpdated) return;

    const password = newPassword.value;
    const confirmation = confirmPassword.value;

    if (password.length < 8 || password.length > 128) {
        showMessage(
            "Password must contain between 8 and 128 characters.",
            "error"
        );
        return;
    }

    if (password !== confirmation) {
        showMessage(
            "Passwords do not match. Please try again.",
            "error"
        );
        return;
    }

    if (!token) {
        showMessage(
            "Reset token is missing. Please request a new reset link.",
            "error"
        );
        return;
    }

    if (
        !GAS_URL ||
        GAS_URL.includes("PASTE_YOUR_EXISTING")
    ) {
        showMessage(
            "Please configure your Google Apps Script Web App URL first.",
            "error"
        );
        return;
    }

    resetBtn.disabled = true;
    resetBtn.textContent = "Updating password...";

    try {
        const response = await fetch(GAS_URL,{
            method:"POST",
            body:new URLSearchParams({
                action:"resetPassword",
                token:token,
                newPassword:password
            })
        });

        if (!response.ok) {
            throw new Error("Request failed.");
        }

        const result = await response.json();

        if (result.success) {
            passwordUpdated = true;

            showMessage(
                result.message ||
                "Password updated successfully. You can now log in.",
                "success"
            );

            form.reset();
            updateRules();

            resetBtn.textContent = "Password Updated";

            // Remove the token from the address bar after success.
            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );
        } else {
            showMessage(
                result.error ||
                result.message ||
                "This reset link is invalid, expired, or already used. Please request a new one.",
                "error"
            );

            resetBtn.disabled = false;
            resetBtn.textContent = "Reset Password";
        }
    } catch(error) {
        console.error("Password reset failed:",error);

        showMessage(
            "Unable to reset your password right now. Please try again.",
            "error"
        );

        resetBtn.disabled = false;
        resetBtn.textContent = "Reset Password";
    }
});
</script>
</body>
</html>
