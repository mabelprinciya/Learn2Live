
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071A35">
  <title>Admin Login | Learn2Live</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #071A35;
      --navy-light: #102B50;
      --blue: #1769FF;
      --blue-dark: #1052D8;
      --gold: #D4AF37;
      --white: #FFFFFF;
      --background: #F3F6FB;
      --text: #172B46;
      --muted: #77869B;
      --border: #E3EAF3;
      --danger: #C6283D;
      --success: #18794E;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, #DFE9FF 0, transparent 32%),
        radial-gradient(circle at 90% 90%, #F8EFCF 0, transparent 30%),
        var(--background);
    }

    button,
    input {
      font: inherit;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 42px 38px 30px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 23px;
      background: var(--white);
      box-shadow: 0 25px 70px rgba(7, 26, 53, 0.13);
      animation: appear 0.45s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin-bottom: 15px;
      border-radius: 18px;
      background: linear-gradient(135deg, #F6E5A6, var(--gold));
      color: var(--navy);
      font-family: 'Poppins', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      box-shadow: 0 8px 23px rgba(212, 175, 55, 0.22);
    }

    .brand-name {
      font-family: 'Poppins', sans-serif;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.7px;
      color: var(--navy);
    }

    .brand-subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .heading-label {
      color: var(--blue);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .heading h1 {
      margin-top: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 29px;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--navy);
    }

    .heading p {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    .form-group {
      margin-bottom: 21px;
    }

    .form-label {
      display: block;
      margin-bottom: 9px;
      color: #293C55;
      font-size: 11px;
      font-weight: 700;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: #8292A8;
      pointer-events: none;
    }

    .input-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .form-input {
      width: 100%;
      height: 51px;
      padding: 0 44px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: #FBFCFE;
      color: var(--navy);
      font-size: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: #A0ACBC;
    }

    .form-input:hover {
      border-color: #C5D2E3;
    }

    .form-input:focus {
      border-color: var(--blue);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(23, 105, 255, 0.09);
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 11px;
      transform: translateY(-50%);
      min-width: 38px;
      min-height: 35px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #718096;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .password-toggle:hover {
      color: var(--blue);
      background: #EDF3FF;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 2px 0 24px;
    }

    .remember-label,
    .secure-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #687A91;
      font-size: 10px;
    }

    .remember-label {
      cursor: pointer;
    }

    .remember-label input {
      width: 14px;
      height: 14px;
      accent-color: var(--blue);
    }

    .secure-label svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .login-button {
      width: 100%;
      min-height: 51px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 18px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(110deg, var(--blue), var(--blue-dark));
      color: var(--white);
      box-shadow: 0 8px 20px rgba(23, 105, 255, 0.2);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .login-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(23, 105, 255, 0.27);
    }

    .login-button:focus-visible {
      outline: 3px solid rgba(23, 105, 255, 0.3);
      outline-offset: 3px;
    }

    .login-button:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    .button-arrow {
      font-size: 17px;
      line-height: 1;
    }

    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message-box {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .message-box.error {
      display: block;
      color: var(--danger);
      background: #FFF1F3;
      border-color: #F6D5DB;
    }

    .message-box.success {
      display: block;
      color: var(--success);
      background: #ECF9F1;
      border-color: #C8EBD6;
    }

    .security-note {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      margin-top: 24px;
      padding: 13px;
      border: 1px solid #F0E5BD;
      border-radius: 11px;
      background: #FFFCF3;
    }

    .security-icon {
      flex-shrink: 0;
      font-size: 18px;
    }

    .security-note strong {
      display: block;
      margin-bottom: 4px;
      color: #665116;
      font-size: 10px;
      font-weight: 800;
    }

    .security-note p {
      color: #8B7950;
      font-size: 10px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 25px;
      color: #97A4B5;
      text-align: center;
      font-size: 9px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 32px 23px 24px;
        border-radius: 19px;
      }

      .brand {
        margin-bottom: 28px;
      }

      .brand-logo {
        width: 55px;
        height: 55px;
        border-radius: 15px;
      }

      .heading h1 {
        font-size: 26px;
      }
    }

    @media (max-width: 350px) {
      .login-card {
        padding: 26px 17px 20px;
      }

      .form-options {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="login-card">

    <header class="brand">
      <div class="brand-logo" aria-hidden="true">L2</div>
      <div class="brand-name">Learn2Live</div>
      <div class="brand-subtitle">Administrator Portal</div>
    </header>

    <section class="heading">
      <div class="heading-label">Admin Access</div>
      <h1>Welcome back</h1>
      <p>Sign in to access your administration dashboard.</p>
    </section>

    <div
      id="messageBox"
      class="message-box"
      role="alert"
      aria-live="polite"
    ></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>

        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 6 9-6"></path>
            </svg>
          </span>

          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            placeholder="Enter your admin email"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            maxlength="254"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>

        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              <path d="M12 14v3"></path>
            </svg>
          </span>

          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            class="password-toggle"
            type="button"
            id="togglePassword"
            aria-label="Show password"
            aria-pressed="false"
          >Show</button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-label" for="rememberEmail">
          <input type="checkbox" id="rememberEmail">
          Remember email
        </label>

        <span class="secure-label">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          </svg>
          Secure sign-in
        </span>
      </div>

      <button class="login-button" type="submit" id="loginButton">
        <span id="buttonText">Sign In to Dashboard</span>
        <span class="button-arrow" id="buttonArrow" aria-hidden="true">→</span>
      </button>
    </form>

    <aside class="security-note">
      <div class="security-icon" aria-hidden="true">🛡️</div>
      <div>
        <strong>Secure administrator access</strong>
        <p>Your account is for authorized administrators only. Keep your password private.</p>
      </div>
    </aside>

    <footer class="footer">
      © 2026 Learn2Live · Admin Portal
      <br>
      Authorized access only
    </footer>

  </main>


<script>
const loginForm = document.getElementById("adminLoginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const rememberCheckbox = document.getElementById("rememberEmail");
const togglePassword = document.getElementById("togglePassword");
const loginButton = document.getElementById("loginButton");
const buttonText = document.getElementById("buttonText");
const buttonArrow = document.getElementById("buttonArrow");
const messageBox = document.getElementById("messageBox");

function showToast(message, type) {
    messageBox.textContent = message;
    messageBox.className = "message-box " + type;
}

function hideToast() {
    messageBox.textContent = "";
    messageBox.className = "message-box";
}

togglePassword.addEventListener("click", function () {
    const isPassword = passwordInput.type === "password";

    passwordInput.type = isPassword ? "text" : "password";
    togglePassword.textContent = isPassword ? "Hide" : "Show";
    togglePassword.setAttribute("aria-label",
        isPassword ? "Hide password" : "Show password"
    );
    togglePassword.setAttribute("aria-pressed", String(isPassword));
});

const savedEmail = localStorage.getItem("learn2liveAdminEmail");

if (savedEmail) {
    emailInput.value = savedEmail;
    rememberCheckbox.checked = true;
}

loginForm.addEventListener("submit", function (event) {
    event.preventDefault();
    hideToast();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (
        email === "admin@l2l.com" &&
        password === "@Mabel02#"
    ) {
        if (rememberCheckbox.checked) {
            localStorage.setItem("learn2liveAdminEmail", email);
        } else {
            localStorage.removeItem("learn2liveAdminEmail");
        }

        showToast("Login successful!", "success");

        loginButton.disabled = true;
        buttonText.textContent = "Login Successful";
        buttonArrow.textContent = "✓";

        setTimeout(function () {
            window.location.href = "admin.html";
        }, 1500);

    } else {
        showToast(
            "Login unsuccessful! Invalid email or password.",
            "error"
        );
        passwordInput.value = "";
        passwordInput.focus();
    }
});
</script>


</body>
</html>
