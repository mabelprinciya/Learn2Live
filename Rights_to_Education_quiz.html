<!DOCTYPE html>
<html lang="en">

<head>
    <script src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Right to Education Quiz | Life Skills Hub</title>

    <link rel="stylesheet" href="Rights_to_Education_quiz.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

<div class="quiz-container">

    <!-- LEFT PANEL -->

    <div class="question-panel">

        <h2>Questions</h2>

        <div id="questionNumbers"></div>

    </div>


    <!-- RIGHT PANEL -->

    <div class="quiz-panel">

        <div class="quiz-header">

            <h1>📚 Right to Education Quiz</h1>

            <p>Answer all 5 questions.</p>

        </div>


        <div class="question-card">

            <h2 id="question">
                Loading Question...
            </h2>

            <div id="options" class="options"></div>

        </div>


        <!-- BUTTONS -->

        <div class="button-area">

            <button id="prevBtn">
                Previous
            </button>

            <button id="nextBtn">
                Next
            </button>

            <button id="submitBtn" style="display:none;">
                Submit Quiz
            </button>

        </div>


        <!-- RESULT CARD -->

        <div id="resultCard"
             class="result-card"
             style="display:none;">

            <div id="resultIcon">
                🎉
            </div>

            <h2 id="resultTitle">
                Congratulations!
            </h2>

            <p id="resultSubtitle"></p>

            <div class="score-circle">

                <span id="scoreText">
                    0 / 5
                </span>

                <small id="percentageText">
                    0%
                </small>

            </div>

            <h3 id="resultMessage"></h3>

            <p>
                Correct Answers:
                <strong id="correctAnswers">0</strong>
            </p>

            <p>
                Wrong Answers:
                <strong id="wrongAnswers">0</strong>
            </p>


            <div class="result-buttons">

                <button id="reviewBtn">
                    📋 Review Answers
                </button>

                <button id="retryBtn">
                    🔄 Try Again
                </button>

                <a href="Rights_to_Education.html">

                    <button id="continueBtn">
                        Continue →
                    </button>

                </a>

            </div>

        </div>


        <!-- REVIEW CARD -->

        <div id="reviewCard"
             class="review-card"
             style="display:none;">

            <div class="review-header">

                <h2>📋 Answer Review</h2>

                <p>
                    Check your answers and learn from your mistakes.
                </p>

            </div>

            <div id="reviewContent"></div>

            <button id="backResultBtn"
                    class="back-result-btn">

                ← Back to Result

            </button>

        </div>

    </div>

</div>


<script src="Right_to_Education_quiz.js"></script>

</body>

</html>
